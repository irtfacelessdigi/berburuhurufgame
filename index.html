<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berburu Huruf by irt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --sky-top:#5EC8F2;
    --sky-bottom:#BDEBFF;
    --grass-top:#8FE388;
    --grass-bottom:#4CAF50;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    padding:0;
    background:#3a8fd6;
    font-family:'Baloo 2','Comic Sans MS','Segoe UI',system-ui,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #stage{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #game{
    position:relative;
    width:100%;
    max-width:480px;
    height:100%;
    max-height:calc(480px * 16 / 9);
    aspect-ratio:9/16;
    overflow:hidden;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 42%, var(--grass-top) 45%, var(--grass-bottom) 100%);
    box-shadow:0 0 40px rgba(0,0,0,0.35);
    border-radius:0;
  }
  @media (min-width:481px){
    #game{ border-radius:28px; }
  }

  /* ---------- BACKGROUND DECOR ---------- */
  .sun{
    position:absolute; top:4%; right:8%;
    width:60px; height:60px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #FFF6B0, #FFD24C 70%);
    box-shadow:0 0 30px 10px rgba(255,210,76,0.55);
  }
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50px;
    opacity:0.95;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,0.05));
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }
  .c1{ width:70px; height:26px; top:9%; left:6%; }
  .c1::before{ width:34px; height:34px; top:-16px; left:8px; }
  .c1::after{ width:26px; height:26px; top:-12px; left:36px; }
  .c2{ width:56px; height:20px; top:16%; left:55%; }
  .c2::before{ width:26px; height:26px; top:-12px; left:6px; }
  .c2::after{ width:20px; height:20px; top:-9px; left:28px; }
  .hill{
    position:absolute;
    left:-10%;
    width:120%;
    height:120px;
    border-radius:50%;
    background:#6FCB5E;
    opacity:0.8;
  }
  .hill1{ bottom:8%; }
  .hill2{ bottom:2%; background:#5CB84F; opacity:0.9; }
  .tree{
    position:absolute;
    width:30px;
    aspect-ratio:1/1.3;
  }
  .tree::before{
    content:"";
    position:absolute;
    left:38%; bottom:0;
    width:24%; height:45%;
    background:#8B5A2B;
    border-radius:2px;
  }
  .tree::after{
    content:"";
    position:absolute;
    left:0; top:0;
    width:100%; height:70%;
    background:#5CB85C;
    border-radius:50%;
    box-shadow:-6px 10px 0 -2px #6FCB5E, 6px 10px 0 -2px #4FAE4F;
  }
  .flower{
    position:absolute;
    width:14px; height:14px;
  }
  .flower::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--fc,#FF9E9E);
    border-radius:50%;
    box-shadow:
      -8px 0 0 -3px var(--fc,#FF9E9E),
      8px 0 0 -3px var(--fc,#FF9E9E),
      0 -8px 0 -3px var(--fc,#FF9E9E),
      0 8px 0 -3px var(--fc,#FF9E9E);
  }
  .flower::after{
    content:"";
    position:absolute;
    left:35%; top:35%;
    width:30%; height:30%;
    background:#FFD24C;
    border-radius:50%;
  }

  /* ---------- TOP UI ---------- */
  #topbar{
    position:absolute;
    top:0; left:0; right:0;
    padding:calc(10px + env(safe-area-inset-top,0px)) 10px 8px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    z-index:20;
    pointer-events:none;
  }
  .ui-box{
    background:rgba(255,255,255,0.85);
    border-radius:16px;
    padding:6px 12px;
    text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,0.1);
    min-width:64px;
  }
  .ui-label{
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    color:#5b6b73;
    margin:0;
  }
  .ui-value{
    font-size:22px;
    font-weight:900;
    color:#FF7A3D;
    margin:0;
    line-height:1.1;
  }
  #targetBox{
    background:transparent;
    box-shadow:none;
    padding:0;
    text-align:center;
  }
  #targetBox .ui-label{ color:#3a6b8a; }
  #letterCircle{
    width:80px;
    height:80px;
    margin:4px auto 0;
    border-radius:50%;
    background:rgba(255,255,255,0.92);
    box-shadow:0 4px 0 rgba(0,0,0,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #targetLetter{
    font-family:'Baloo 2','Comic Sans MS','Segoe UI',system-ui,sans-serif;
    font-size:42px;
    font-weight:800;
    line-height:1;
    color:#2E8B57;
    -webkit-text-stroke:1.5px #1c5c39;
    text-shadow:0 2px 0 rgba(0,0,0,0.15);
    transition:transform 0.25s ease;
  }
  #targetLetter.pulse{ animation:pulseLetter 0.5s ease; }
  @keyframes pulseLetter{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.35) rotate(-6deg); }
    100%{ transform:scale(1); }
  }
  #ageBadge{
    position:absolute;
    top:calc(88px + env(safe-area-inset-top,0px));
    left:50%;
    transform:translateX(-50%);
    background:#FFD24C;
    color:#7a4b00;
    font-size:11px;
    font-weight:800;
    padding:3px 12px;
    border-radius:12px;
    box-shadow:0 2px 0 rgba(0,0,0,0.1);
    z-index:20;
    white-space:nowrap;
  }
  #skorLabel{ color:#3a6b8a; }
  #terkumpulLabel{ color:#3a6b8a; }

  /* ---------- PLAY AREA ---------- */
  #playArea{
    position:absolute;
    inset:0;
    z-index:10;
  }

  .obj{
    position:absolute;
    width:29vmin;
    max-width:148px;
    min-width:100px;
    aspect-ratio:1/1;
    cursor:pointer;
    will-change:transform;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,0.28));
  }
  .obj svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }

  .obj.wrong-shake{
    animation:shakeObj 0.4s ease;
    filter:drop-shadow(0 0 10px rgba(255,60,60,0.85)) drop-shadow(0 6px 6px rgba(0,0,0,0.28));
  }
  @keyframes shakeObj{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    20%{ transform:translateX(-8px) rotate(-6deg); }
    40%{ transform:translateX(8px) rotate(6deg); }
    60%{ transform:translateX(-6px) rotate(-4deg); }
    80%{ transform:translateX(6px) rotate(4deg); }
  }

  .obj.correct-pop{
    animation:popObj 0.45s ease forwards;
    filter:drop-shadow(0 0 18px rgba(255,214,0,0.95)) drop-shadow(0 6px 6px rgba(0,0,0,0.28));
  }
  @keyframes popObj{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.35); }
    100%{ transform:scale(0.2); opacity:0; }
  }

  .sparkle{
    position:absolute;
    pointer-events:none;
    font-size:20px;
    animation:sparkleFly 0.6s ease forwards;
    z-index:30;
  }
  @keyframes sparkleFly{
    0%{ transform:translate(0,0) scale(0.5) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg); opacity:0; }
  }

  /* ---------- CELEBRATION OVERLAY ---------- */
  #celebrate{
    position:absolute;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.25s ease;
  }
  #celebrate.show{
    opacity:1;
    background:rgba(255,255,255,0.25);
  }
  #celebrate .msg{
    background:#fff;
    border-radius:28px;
    padding:26px 34px;
    text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,0.15);
    transform:scale(0.7);
    transition:transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  #celebrate.show .msg{ transform:scale(1); }
  #celebrate .msg .big{
    font-size:40px;
    font-weight:900;
    color:#FF7A3D;
    margin:0 0 4px;
  }
  #celebrate .msg .small{
    font-size:16px;
    font-weight:700;
    color:#3a6b8a;
    margin:0;
  }

  /* ---------- START OVERLAY ---------- */
  #startOverlay{
    position:absolute;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 45%, var(--grass-top) 60%, var(--grass-bottom) 100%);
    padding:20px;
  }
  #startOverlay h1{
    font-size:34px;
    color:#fff;
    -webkit-text-stroke:2px #E85D25;
    text-shadow:0 4px 0 rgba(0,0,0,0.15);
    margin:0 0 6px;
    font-weight:900;
  }
  #startOverlay p{
    color:#2b5470;
    font-weight:700;
    font-size:15px;
    max-width:280px;
    margin:0 0 22px;
  }
  #startBtn{
    background:#FF7A3D;
    color:#fff;
    border:none;
    font-size:22px;
    font-weight:900;
    padding:16px 44px;
    border-radius:30px;
    box-shadow:0 6px 0 #C9531D;
    cursor:pointer;
  }
  #startBtn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #C9531D;
  }
  .startIcons{ width:220px; max-width:70%; height:auto; margin-bottom:14px; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.15)); }
</style>
</head>
<body>
<div id="stage">
  <div id="game">

    <!-- background decor -->
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="tree" style="bottom:5%; left:6%; width:34px;"></div>
    <div class="tree" style="bottom:9%; left:73%; width:28px;"></div>
    <div class="flower" style="bottom:3%; left:26%; --fc:#FF8FC6;"></div>
    <div class="flower" style="bottom:2%; left:58%; --fc:#FFD24C;"></div>
    <div class="flower" style="bottom:1%; left:44%; --fc:#FF9E9E;"></div>

    <div id="playArea"></div>

    <div id="topbar">
      <div class="ui-box">
        <p class="ui-label" id="skorLabel">S K O R</p>
        <p class="ui-value" id="skorVal">0</p>
      </div>
      <div id="targetBox">
        <p class="ui-label">CARI HURUF</p>
        <div id="letterCircle">
          <div id="targetLetter">b</div>
        </div>
      </div>
      <div class="ui-box">
        <p class="ui-label" id="terkumpulLabel">TERKUMPUL</p>
        <p class="ui-value" id="terkumpulVal">0/5</p>
      </div>
    </div>
    <div id="ageBadge">Usia 3–6 Tahun</div>

    <div id="celebrate">
      <div class="msg">
        <p class="big">🎉 Hebat! 🎉</p>
        <p class="small">Ayo cari huruf baru!</p>
      </div>
    </div>

    <div id="startOverlay">
      <svg class="startIcons" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
        <circle cx="35" cy="35" r="30" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="2"/>
        <polygon points="35,15 43,21 40,30 30,30 27,21" fill="#2b2b2b"/>
        <text x="35" y="47" font-family="Arial" font-weight="900" font-size="22" fill="#2b2b2b" text-anchor="middle">b</text>
        <rect x="90" y="12" width="46" height="46" rx="8" fill="#3E9DE0"/>
        <text x="113" y="42" font-family="Arial" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle">b</text>
        <rect x="160" y="18" width="55" height="34" rx="11" fill="#FFC93E"/>
        <rect x="167" y="24" width="14" height="12" rx="2" fill="#BEE7FF"/>
        <rect x="186" y="24" width="14" height="12" rx="2" fill="#BEE7FF"/>
        <circle cx="172" cy="55" r="7" fill="#333"/>
        <circle cx="203" cy="55" r="7" fill="#333"/>
      </svg>
      <h1>BERBURU HURUF</h1>
      <p>Sentuh benda yang namanya diawali dengan huruf yang diminta. Yuk mulai berburu!</p>
      <button id="startBtn">MULAI ▶</button>
    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- HAND-DRAWN VECTOR ICONS (no emoji fonts -> renders identically on every device) ----------
  function face(cx, cy, s){
    s = s || 1;
    var ex = 10*s, er = 4.2*s, ery = 5.2*s;
    var cheekX = 15*s, cheekY = 9*s, cheekR = 5.5*s;
    var mouthW = 9*s, mouthY = 9*s, mouthDip = 7*s;
    return ''
      + '<ellipse cx="'+(cx-ex)+'" cy="'+cy+'" rx="'+er+'" ry="'+ery+'" fill="#2b2b2b"/>'
      + '<ellipse cx="'+(cx+ex)+'" cy="'+cy+'" rx="'+er+'" ry="'+ery+'" fill="#2b2b2b"/>'
      + '<circle cx="'+(cx-ex-1.3*s)+'" cy="'+(cy-1.8*s)+'" r="'+(1.4*s)+'" fill="#fff"/>'
      + '<circle cx="'+(cx+ex-1.3*s)+'" cy="'+(cy-1.8*s)+'" r="'+(1.4*s)+'" fill="#fff"/>'
      + '<circle cx="'+(cx-cheekX)+'" cy="'+(cy+cheekY)+'" r="'+cheekR+'" fill="#FF9E9E" opacity="0.6"/>'
      + '<circle cx="'+(cx+cheekX)+'" cy="'+(cy+cheekY)+'" r="'+cheekR+'" fill="#FF9E9E" opacity="0.6"/>'
      + '<path d="M '+(cx-mouthW)+' '+(cy+mouthY)+' Q '+cx+' '+(cy+mouthY+mouthDip)+' '+(cx+mouthW)+' '+(cy+mouthY)+'" stroke="#2b2b2b" stroke-width="'+(2.6*s)+'" fill="none" stroke-linecap="round"/>';
  }
  function eyesOnly(cx, cy, s){
    s = s || 1;
    var ex = 9*s, er = 3.6*s, ery = 4.4*s;
    return ''
      + '<ellipse cx="'+(cx-ex)+'" cy="'+cy+'" rx="'+er+'" ry="'+ery+'" fill="#2b2b2b"/>'
      + '<ellipse cx="'+(cx+ex)+'" cy="'+cy+'" rx="'+er+'" ry="'+ery+'" fill="#2b2b2b"/>'
      + '<circle cx="'+(cx-ex-1*s)+'" cy="'+(cy-1.5*s)+'" r="'+(1.2*s)+'" fill="#fff"/>'
      + '<circle cx="'+(cx+ex-1*s)+'" cy="'+(cy-1.5*s)+'" r="'+(1.2*s)+'" fill="#fff"/>';
  }
  function letter(x, y, ch, color, size, strokeCol){
    size = size || 32;
    var stroke = strokeCol ? ' stroke="'+strokeCol+'" stroke-width="2" paint-order="stroke"' : '';
    return '<text x="'+x+'" y="'+y+'" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="'+size+'" fill="'+color+'" text-anchor="middle" dominant-baseline="central" alignment-baseline="central"'+stroke+'>'+ch+'</text>';
  }
  function svg(inner){
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
  }
  function imageIcon(url, clipId){
    return svg(
      '<defs><clipPath id="clip-'+clipId+'"><circle cx="50" cy="50" r="46"/></clipPath></defs>'
      + '<circle cx="50" cy="50" r="47" fill="#FFFFFF"/>'
      + '<image href="'+url+'" x="2" y="2" width="96" height="96" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-'+clipId+')"/>'
      + '<circle cx="50" cy="50" r="47" fill="none" stroke="#FFFFFF" stroke-width="5"/>'
    );
  }
  function plainImageIcon(url){
    // no circle frame, no background, no border - just the image shape itself
    return svg(
      '<image href="'+url+'" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>'
    );
  }

  var OBJECTS = [
    {name:"objek-a", letter:"a", art: plainImageIcon("https://raw.githubusercontent.com/irtfacelessdigi/berburuhurufgame/main/public/icon/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2012_33_18%20PM.png")},
    {name:"objek-b", letter:"b", art: imageIcon("https://raw.githubusercontent.com/irtfacelessdigi/berburuhurufgame/main/public/icon/slice-02.png", "b")},
    {name:"objek-c", letter:"c", art: imageIcon("https://raw.githubusercontent.com/irtfacelessdigi/berburuhurufgame/main/public/icon/slice-03.png", "c")},
    {name:"objek-d", letter:"d", art: imageIcon("https://raw.githubusercontent.com/irtfacelessdigi/berburuhurufgame/main/public/icon/slice-04.png", "d")},
    {name:"objek-e", letter:"e", art: imageIcon("https://raw.githubusercontent.com/irtfacelessdigi/berburuhurufgame/main/public/icon/slice-05.png", "e")},
    {name:"objek-f", letter:"f", art: imageIcon("https://raw.githubusercontent.com/irtfacelessdigi/berburuhurufgame/main/public/icon/slice-06.png", "f")},
    {name:"objek-g", letter:"g", art: imageIcon("https://raw.githubusercontent.com/irtfacelessdigi/berburuhurufgame/main/public/icon/slice-07.png", "g")},
    {name:"objek-h", letter:"h", art: imageIcon("https://raw.githubusercontent.com/irtfacelessdigi/berburuhurufgame/main/public/icon/slice-08.png", "h")}
  ];

  var GOAL_PER_ROUND = 5;
  var MAX_OBJECTS = 4;
  var SPAWN_GAP_MS = 650;

  // ---------- STATE ----------
  var score = 0;
  var progress = 0;
  var targetLetter = "b";
  var running = false;
  var lastSpawn = 0;
  var lastFrame = 0;
  var objects = []; // {el, top, speed, baseX, bobPhase, bobAmp, letter}
  var idCounter = 0;

  // ---------- DOM ----------
  var playArea = document.getElementById("playArea");
  var skorVal = document.getElementById("skorVal");
  var terkumpulVal = document.getElementById("terkumpulVal");
  var targetLetterEl = document.getElementById("targetLetter");
  var celebrateEl = document.getElementById("celebrate");
  var startOverlay = document.getElementById("startOverlay");
  var startBtn = document.getElementById("startBtn");
  var game = document.getElementById("game");

  // ---------- AUDIO ----------
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
      }catch(e){ audioCtx = null; }
    }
    if(audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume();
    }
  }
  function tone(freq, start, dur, type, vol){
    if(!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(vol||0.25, start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start+dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start+dur+0.02);
  }
  function playDing(){
    if(!audioCtx) return;
    var t = audioCtx.currentTime;
    tone(880, t, 0.12, "sine", 0.22);
    tone(1320, t+0.09, 0.18, "sine", 0.2);
  }
  function playWrong(){
    if(!audioCtx) return;
    var t = audioCtx.currentTime;
    tone(220, t, 0.18, "sine", 0.15);
  }
  function playCelebrate(){
    if(!audioCtx) return;
    var t = audioCtx.currentTime;
    [660,880,990,1320].forEach(function(f,i){
      tone(f, t+i*0.09, 0.16, "triangle", 0.18);
    });
  }

  // ---------- VOICE (TTS) ----------
  var idVoice = null;
  function pickIndonesianVoice(){
    if(!window.speechSynthesis) return null;
    var voices = window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf("id") === 0){
        return voices[i];
      }
    }
    return null;
  }
  if(window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged = function(){
      idVoice = pickIndonesianVoice();
    };
    idVoice = pickIndonesianVoice();
  }
  function speakTargetLetter(ch){
    if(!window.speechSynthesis) return;
    try{
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance("Coba temukan huruf " + ch);
      utter.lang = "id-ID";
      if(idVoice) utter.voice = idVoice;
      utter.rate = 0.9;
      utter.pitch = 1.15;
      window.speechSynthesis.speak(utter);
    }catch(e){ /* speech not supported, ignore */ }
  }
  function speakLetterSound(ch){
    if(!window.speechSynthesis) return;
    try{
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(ch);
      utter.lang = "id-ID";
      if(idVoice) utter.voice = idVoice;
      utter.rate = 0.7;
      utter.pitch = 1.3;
      window.speechSynthesis.speak(utter);
    }catch(e){ /* speech not supported, ignore */ }
  }

  // ---------- HELPERS ----------
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function distinctLetters(){
    var set = {};
    OBJECTS.forEach(function(o){ set[o.letter] = true; });
    return Object.keys(set);
  }

  function pickNewTarget(){
    var letters = distinctLetters();
    var choice;
    do{
      choice = pick(letters);
    }while(choice === targetLetter && letters.length > 1);
    targetLetter = choice;
    targetLetterEl.textContent = targetLetter;
    targetLetterEl.classList.remove("pulse");
    void targetLetterEl.offsetWidth;
    targetLetterEl.classList.add("pulse");
    speakTargetLetter(targetLetter);
  }

  function chooseWord(){
    // ~45% chance to spawn a correct-letter object, else a distractor
    var correctPool = OBJECTS.filter(function(o){ return o.letter === targetLetter; });
    var wrongPool = OBJECTS.filter(function(o){ return o.letter !== targetLetter; });
    if(Math.random() < 0.45 && correctPool.length){
      return pick(correctPool);
    }
    return pick(wrongPool.length ? wrongPool : OBJECTS);
  }

  function spawnObject(){
    if(objects.length >= MAX_OBJECTS) return;
    var word = chooseWord();
    var areaH = playArea.clientHeight;
    var areaW = playArea.clientWidth;

    var el = document.createElement("div");
    el.className = "obj";
    var sizeGuess = Math.min(areaW, areaH) * 0.32;
    var leftPct = rand(3, 65);
    el.style.left = leftPct + "%";
    el.style.top = (areaH + sizeGuess) + "px";

    el.innerHTML = word.art;

    el.dataset.letter = word.letter;
    el.dataset.id = (++idCounter);

    playArea.appendChild(el);

    var obj = {
      id: idCounter,
      el: el,
      top: areaH + sizeGuess,
      speed: rand(140, 210), // px per second
      baseLeft: leftPct,
      bobPhase: rand(0, Math.PI*2),
      bobAmp: rand(4, 10),
      bobSpeed: rand(1.2, 2.2),
      letter: word.letter,
      dead: false
    };

    el.addEventListener("pointerdown", function(e){
      e.preventDefault();
      handleTap(obj);
    }, {passive:false});

    objects.push(obj);
  }

  function removeObject(obj){
    obj.dead = true;
    if(obj.el && obj.el.parentNode){
      obj.el.parentNode.removeChild(obj.el);
    }
    objects = objects.filter(function(o){ return o !== obj; });
  }

  function spawnSparkles(x, y){
    var emojis = ["✨","⭐","🌟"];
    for(var i=0;i<6;i++){
      var s = document.createElement("div");
      s.className = "sparkle";
      s.textContent = pick(emojis);
      s.style.left = x + "px";
      s.style.top = y + "px";
      var dx = rand(-60,60);
      var dy = rand(-70,-10);
      s.style.setProperty("--dx", dx + "px");
      s.style.setProperty("--dy", dy + "px");
      playArea.appendChild(s);
      (function(node){
        setTimeout(function(){
          if(node.parentNode) node.parentNode.removeChild(node);
        }, 650);
      })(s);
    }
  }

  function handleTap(obj){
    if(!running || obj.dead) return;
    ensureAudio();
    var rect = obj.el.getBoundingClientRect();
    var areaRect = playArea.getBoundingClientRect();
    var cx = rect.left - areaRect.left + rect.width/2;
    var cy = rect.top - areaRect.top + rect.height/2;

    if(obj.letter === targetLetter){
      // correct
      obj.dead = true;
      obj.el.classList.add("correct-pop");
      spawnSparkles(cx, cy);
      playDing();
      speakLetterSound(obj.letter);
      score += 1;
      progress += 1;
      skorVal.textContent = score;
      terkumpulVal.textContent = progress + "/" + GOAL_PER_ROUND;

      setTimeout(function(){
        removeObject(obj);
      }, 420);

      if(progress >= GOAL_PER_ROUND){
        setTimeout(function(){
          celebrateRound();
        }, 200);
      }
    } else {
      // wrong
      playWrong();
      obj.el.classList.remove("wrong-shake");
      void obj.el.offsetWidth;
      obj.el.classList.add("wrong-shake");
      setTimeout(function(){
        if(obj.el) obj.el.classList.remove("wrong-shake");
      }, 420);
    }
  }

  function celebrateRound(){
    running = false;
    playCelebrate();
    celebrateEl.classList.add("show");
    setTimeout(function(){
      celebrateEl.classList.remove("show");
      progress = 0;
      terkumpulVal.textContent = "0/" + GOAL_PER_ROUND;
      pickNewTarget();
      running = true;
    }, 1600);
  }

  // ---------- LOOP ----------
  function frame(ts){
    if(!lastFrame) lastFrame = ts;
    var dt = (ts - lastFrame) / 1000;
    lastFrame = ts;

    if(running){
      var areaH = playArea.clientHeight;

      objects.forEach(function(obj){
        if(obj.dead) return;
        obj.top -= obj.speed * dt;
        obj.bobPhase += dt * obj.bobSpeed;
        var bobX = Math.sin(obj.bobPhase) * obj.bobAmp;
        obj.el.style.top = obj.top + "px";
        obj.el.style.transform = "translateX(" + bobX + "px)";

        if(obj.top < -120){
          removeObject(obj);
        }
      });

      if(ts - lastSpawn > SPAWN_GAP_MS && objects.length < MAX_OBJECTS){
        spawnObject();
        lastSpawn = ts;
      }
    }

    requestAnimationFrame(frame);
  }

  // ---------- START ----------
  function startGame(){
    ensureAudio();
    startOverlay.style.display = "none";
    running = true;
    score = 0;
    progress = 0;
    skorVal.textContent = "0";
    terkumpulVal.textContent = "0/" + GOAL_PER_ROUND;
    pickNewTarget();
    // seed a couple of objects right away
    for(var i=0;i<3;i++){
      setTimeout(spawnObject, i*300);
    }
    requestAnimationFrame(frame);
  }

  startBtn.addEventListener("click", startGame);
  startBtn.addEventListener("touchend", function(e){ e.preventDefault(); startGame(); }, {passive:false});

})();
</script>
